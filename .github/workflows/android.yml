name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android project
        run: |
          set -o pipefail
          bash android-build/prepare.sh 2>&1 | tee /tmp/prepare.log
        env:
          RUN_NUMBER: ${{ github.run_number }}
      - name: Build signed APK
        run: |
          set -o pipefail
          bash android-build/build.sh 2>&1 | tee /tmp/build.log
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/ahlulbayt-path.apk \
            --title "Android app 1.${{ github.run_number }}" \
            --notes "The Path of the Ahl al-Bayt for Android. Download ahlulbayt-path.apk below, open it and tap Install." \
            --latest
      - name: Save the logs if something failed
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp /tmp/*.log /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && git init -q && git checkout -q -b build-logs
          git config user.name "build-bot" && git config user.email "build-bot@users.noreply.github.com"
          git add -A && git commit -qm "Build logs for run ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
